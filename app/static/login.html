<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panini · Sign in</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <div class="logo">⚽ Panini</div>
    <p class="tagline">Your personal World Cup prediction model.</p>
    <form id="login-form">
      <input type="password" id="password" placeholder="Password" autofocus
             autocomplete="current-password" />
      <button type="submit">Sign in</button>
      <p id="error" class="error" hidden></p>
    </form>
  </main>
  <script>
    // If the app is open (no auth required), skip the login screen.
    fetch('/api/meta').then(r => r.json()).then(m => {
      if (!m.auth_required) window.location.href = '/';
    }).catch(() => {});
    const form = document.getElementById('login-form');
    const err = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const body = new FormData();
      body.append('password', document.getElementById('password').value);
      const res = await fetch('/api/login', { method: 'POST', body });
      if (res.ok) {
        window.location.href = '/';
      } else {
        err.textContent = 'Wrong password. Try again.';
        err.hidden = false;
      }
    });
  </script>
</body>
</html>
